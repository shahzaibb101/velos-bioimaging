[project]
name = "velos"
version = "0.1.0"
description = "Label-free quantitative phase imaging: forward model, classical solver, learned reconstruction and serving layer."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "tifffile>=2024.1.30",
    "imagecodecs>=2024.1.1",
    "Pillow>=10.2",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "onnx>=1.15",
]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "onnxruntime>=1.17",
    "redis>=5.0",
    "rq>=1.15",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["velos*"]
